<div class="auth-page">

    <div class="auth-card">

        <h1>Регистрация</h1>

        <form id="register-form">

            <input
                    id="register-username"
                    type="text"
                    placeholder="Имя пользователя"
                    required
            >

            <input
                    id="register-login"
                    type="text"
                    placeholder="Логин"
                    required
            >

            <input
                    id="register-password"
                    type="password"
                    placeholder="Пароль"
                    required
            >

            <button type="submit">
                Создать аккаунт
            </button>

        </form>

        <p>
            Уже есть аккаунт?
            <a id="go-login">Войти</a>
        </p>

    </div>

</div>
