<div class="player-page">
    <div class="artist-page-header">
        <a id="player-page-back-button" class="album-page-back">
            <img class="album-page-header-back" src="/images/chevron-left.svg">
        </a>

        <h1 class="artist-page-artist-name">
            текущий трек
        </h1>

        <a class="global-header-profile">
            <img class="global-header-user" src="/images/user.svg">
        </a>
    </div>

    <div class="player-page-track">

        <div id="player-page-container" class="player-page-track-info">
            <img class="player-page-track-image" src="">
            <h2 class="player-page-track-info-name">
            </h2>
            <h2 class="player-page-track-info-artist">
            </h2>
        </div>

        <div class="player-page-track-text-wrapper">

            <div class="player-page-track-text">

            </div>
        </div>

    </div>

    <div class="player-page-player">

        <div class="player-page-progress">
            <h4 class="player-page-h4-left">0:00</h4>

            <div class="player-page-progress-bar">

                <div class="player-page-progress-track">

                    <div class="player-page-progress-fill">

                        <div class="player-page-progress-thumb"></div>

                    </div>

                </div>

            </div>

            <h4 class="player-page-h4-right">5:00</h4>
        </div>

        <div class="player-page-controls">

            <button class="player-btn prev">
                <img class="player-page-prev-button" src="../images/skip-next.svg">
            </button>

            <button class="player-btn play">
                <img class="player-page-main-button" src="../images/play.svg">
            </button>

            <button class="player-btn next">
                <img class="player-page-next-button" src="../images/skip-next.svg">
            </button>
        </div>

    </div>
</div>
