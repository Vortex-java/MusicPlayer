<div class="auth-page">

    <div class="auth-card">

        <h1>Вход</h1>

        <form id="login-form">

            <input
                    id="login-login"
                    type="text"
                    placeholder="Логин"
                    required
            >

            <input
                    id="login-password"
                    type="password"
                    placeholder="Пароль"
                    required
            >

            <button type="submit">
                Войти
            </button>

        </form>

        <p>
            Нет аккаунта?
            <a id="go-register">Зарегистрироваться</a>
        </p>

    </div>

</div>
